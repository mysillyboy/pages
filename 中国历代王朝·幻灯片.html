<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="E1YEOFTLk3LEWc73gajwBW">
<head data-page-node-id="QqOW8HzDg1O5UrGxhnc9WD">
<meta charset="utf-8" data-page-node-id="VB6H8hjeybW7qWmFbvn1Xh">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="Vf8I9eMAfqcLMsuNUuHu7E">

<title>中国历史年表 · 幻灯片</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#1B1B1B;
    --ink2:#4C4A46;
    --ink3:#7E7870;
    --paper:#FCFBF7;
    --line:#E4DFD4;
    --card:#FFFFFF;
    --bar:#E8E3D8;
    --halo:rgba(255,255,255,.9);
    --folio:#B5B0A5;
    --page-bg:#EDEAE3;
    --deco-line:rgba(30,26,20,.14);
    --shadow:0 24px 80px rgba(40,34,24,.18);
    --card-shadow:0 10px 26px rgba(40,34,24,.12);
    --rule:#B03A2E;
    /* 六个时代的主题色，深色模式整体提亮 */
    --e0:#8B6B47;
    --e1:#B03A2E;
    --e2:#6E5A8E;
    --e3:#C4703A;
    --e4:#2E8C9E;
    --e5:#1F4E9C;
    --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  }
  /* 深色模式 */
  [data-theme="dark"]{
    --ink:#EDE9DF;
    --ink2:#B4AEA2;
    --ink3:#9A958A;
    --paper:#171614;
    --line:#332F29;
    --card:#201E1A;
    --bar:#2B2822;
    --halo:rgba(23,22,20,.92);
    --folio:#7B766D;
    --page-bg:#0C0B0A;
    --deco-line:rgba(237,233,223,.18);
    --shadow:0 24px 80px rgba(0,0,0,.62);
    --card-shadow:0 10px 26px rgba(0,0,0,.45);
    --rule:#D9553F;
    --e0:#C79A5E;
    --e1:#E06B5C;
    --e2:#A18BD0;
    --e3:#E09354;
    --e4:#52BCCB;
    --e5:#6E9EE4;
  }
  html,body{height:100%;overflow:hidden;background:var(--page-bg)}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

  #stage{
    position:relative;width:1600px;height:900px;flex:0 0 auto;
    background:var(--paper);overflow:hidden;
    box-shadow:var(--shadow);
    transform-origin:center center;
  }

  /* ---------- slide base ---------- */
  .slide{
    position:absolute;inset:0;padding:66px 130px 52px;
    display:flex;flex-direction:column;
    opacity:0;pointer-events:none;
    transform:translateY(48px);
    transition:opacity .32s ease,transform .45s cubic-bezier(.4,0,.2,1);
    will-change:opacity,transform;
  }
  .slide.past{transform:translateY(-48px)}
  .slide.future{transform:translateY(48px)}
  .slide.active{
    opacity:1;pointer-events:auto;transform:translateY(0);
    transition:opacity .5s ease .1s,transform .58s cubic-bezier(.22,1,.36,1) .1s;
  }

  .anim{opacity:0}
  .slide.active .anim{animation:rise .72s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- head ---------- */
  .head{display:flex;justify-content:flex-end;align-items:baseline;height:34px;flex:0 0 auto}
  .head .era{font-size:14px;letter-spacing:.28em;color:var(--ink3);padding-left:14px;border-left:2px solid var(--c)}
  .clickhint{display:inline-flex;align-items:center;gap:7px;margin-right:auto;
    font-size:11px;letter-spacing:.1em;color:var(--ink3)}
  .clickhint i{width:9px;height:9px;border-radius:50%;border:1.5px dashed var(--c);display:inline-block;opacity:.8}

  /* ---------- title ---------- */
  .tblock{flex:0 0 auto;margin-top:22px}
  .dname{
    font-family:var(--serif);font-weight:700;line-height:1.14;letter-spacing:.06em;
    color:var(--ink);
  }
  .dname .sub{font-size:.3em;color:var(--ink3);letter-spacing:.14em;margin-left:.5em;font-family:var(--sans);font-weight:600}
  .yrs{
    margin-top:10px;font-size:40px;font-weight:700;color:var(--c);
    letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .yrs small{font-size:16px;font-weight:500;color:var(--ink3);letter-spacing:.1em;margin-left:14px}
  .lead{
    margin-top:14px;font-size:18px;line-height:1.72;color:var(--ink2);max-width:1000px;
  }
  .span-note{margin-left:18px;font-size:12px;font-weight:400;font-style:normal;letter-spacing:.05em;
    color:var(--ink3);font-family:var(--sans);white-space:nowrap}

  /* ---------- viz ---------- */
  .viz{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0 4px}
  .viz svg{width:100%;height:auto;overflow:visible}

  /* svg styles */
  .axis-line{stroke:var(--c);stroke-width:2;opacity:.3;stroke-linecap:round}
  .axis-cap{fill:var(--paper);stroke:var(--c);stroke-width:2.5}
  .ev-dot{fill:var(--c);stroke:var(--paper);stroke-width:3.5}
  .ev-link{stroke:var(--c);stroke-width:1;opacity:.4}
  .ev-name{font-family:var(--sans);font-size:18.5px;font-weight:700;fill:var(--ink);text-anchor:middle}
  .ev-year{font-family:var(--sans);font-size:13.5px;font-weight:600;fill:var(--c);text-anchor:middle;font-variant-numeric:tabular-nums}
  .phase-band{fill:var(--c);opacity:.17}
  .phase-name{font-family:var(--sans);font-size:12px;font-weight:700;fill:var(--c);letter-spacing:.14em;opacity:.9}
  .lane-title{font-family:var(--sans);font-size:13px;font-weight:700;fill:var(--c);letter-spacing:.22em}
  .lane-name{font-family:var(--sans);font-size:13.5px;font-weight:600;fill:var(--ink2);text-anchor:end}
  .lane-year{font-family:var(--sans);font-size:12px;fill:var(--ink3);font-variant-numeric:tabular-nums}
  .lane-bar{fill:var(--c);opacity:.74}
  .lane-bar.ghost{opacity:.32}
  .lane-more{stroke:var(--c);stroke-width:2;stroke-dasharray:2 3;opacity:.55;stroke-linecap:round}
  .sub-axis{stroke:var(--c);stroke-width:1;opacity:.55}

  /* 可点击事件 */
  .ev-g{cursor:pointer}
  .ev-halo{fill:var(--c);opacity:0;transition:opacity .2s}
  .ev-g:hover .ev-halo{opacity:.09}
  .ev-name{transition:fill .2s}
  .ev-g:hover .ev-name{fill:var(--c)}
  .ev-ring{fill:none;stroke:var(--c);stroke-width:1.2;stroke-dasharray:2.5 3;opacity:.7;transition:opacity .2s}
  .ev-g:hover .ev-ring{opacity:1}

  /* ---------- 事件详情页 ---------- */
  .detail{
    position:absolute;inset:0;z-index:20;background:var(--paper);
    padding:56px 130px 44px;display:flex;flex-direction:column;overflow:hidden;
    opacity:0;pointer-events:none;transform:translateX(76px);
    transition:opacity .26s ease,transform .5s cubic-bezier(.22,1,.36,1);
  }
  .detail.open{opacity:1;pointer-events:auto;transform:translateX(0)}
  .detail .anim{opacity:0}
  .detail.open .anim{animation:rise .62s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
  .detail .head{justify-content:space-between}
  .dback{
    display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 18px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink2);
    font-family:var(--sans);font-size:13.5px;letter-spacing:.06em;cursor:pointer;transition:.2s;
  }
  .dback:hover{border-color:var(--c);color:var(--c);box-shadow:var(--card-shadow)}
  .dwrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .dtt{flex:0 0 auto;margin-top:24px}
  .dyear{font-size:19px;font-weight:700;color:var(--c);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .dtitle{font-family:var(--serif);font-size:80px;font-weight:700;line-height:1.08;letter-spacing:.07em;margin-top:2px}
  .dsum{margin-top:13px;font-size:16.5px;line-height:1.72;color:var(--ink2);max-width:1090px}
  .dbody{display:grid;grid-template-columns:1.45fr 1fr;gap:56px;margin-top:22px;flex:0 0 auto;min-height:0;align-content:start}
  .dh{display:flex;justify-content:space-between;align-items:baseline;
      font-size:12px;letter-spacing:.22em;color:var(--ink3);
      padding-bottom:9px;border-bottom:1px solid var(--line)}
  .dh em{font-style:normal;letter-spacing:.06em;opacity:.7;font-variant-numeric:tabular-nums}
  .steps{position:relative;margin-top:16px;padding-left:84px}
  .steps::before{content:"";position:absolute;left:78px;top:9px;bottom:18px;width:1px;background:var(--line)}
  .step{position:relative;padding:0 0 15px 16px}
  .steps.loose .step{padding-bottom:30px}
  .step::before{content:"";position:absolute;left:-10.5px;top:6px;width:9px;height:9px;border-radius:50%;
    background:var(--paper);border:2px solid var(--c);box-sizing:border-box}
  .step .sy{position:absolute;left:-82px;top:2px;width:68px;text-align:right;
    font-size:13px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .step .st{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:3px;letter-spacing:.03em}
  .step .sd{font-size:13.5px;line-height:1.62;color:var(--ink2)}
  .ppl{margin-top:15px;display:flex;flex-direction:column;gap:13px}
  .pp{display:grid;grid-template-columns:140px 1fr;gap:14px}
  .pp .pn{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:.03em;line-height:1.4}
  .pp .pr{font-size:11px;line-height:1.5;color:var(--c);margin-top:4px;opacity:.9}
  .pp .pd{font-size:13px;line-height:1.6;color:var(--ink2);padding-top:1px}
  .dimp{flex:0 0 auto;margin-top:10px}
  .imp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:13px}
  .icard{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--c);
    border-radius:10px;padding:12px 15px 13px}
  .icard b{display:block;font-size:13.5px;color:var(--ink);letter-spacing:.05em;margin-bottom:5px}
  .icard span{font-size:12.5px;line-height:1.62;color:var(--ink2)}

  .slide.active .ev-dot{animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--pd,.4s)}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .ev-dot{transform-box:fill-box;transform-origin:center}
  .slide.active .axis-line{animation:draw .95s cubic-bezier(.4,0,.2,1) backwards;animation-delay:.15s}
  @keyframes draw{from{stroke-dashoffset:1300}to{stroke-dashoffset:0}}
  .axis-line{stroke-dasharray:1300}

  /* ---------- bottom ---------- */
  .facts{display:flex;gap:0;flex:0 0 auto;border-top:1px solid var(--line);padding-top:16px}
  .fact{flex:1 1 0;padding-right:28px}
  .fact+.fact{padding-left:28px;border-left:1px solid var(--line)}
  .fact .k{font-size:12px;letter-spacing:.2em;color:var(--ink3);margin-bottom:5px}
  .fact .v{font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.45}

  .mini{flex:0 0 auto;margin-top:16px;display:flex;align-items:center;gap:14px}
  .mini .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink3);white-space:nowrap}
  .mini .bar{position:relative;flex:1 1 auto;height:4px;background:var(--bar);border-radius:2px}
  .mini .bar i{position:absolute;top:-2px;height:8px;border-radius:4px;background:var(--c);opacity:.85;box-shadow:0 0 0 3px var(--halo)}
  .mini .bar i::after{content:"";position:absolute;inset:0;border-radius:4px;background:var(--c)}

  /* ---------- cover ---------- */
  .cover{
    padding:0;justify-content:center;align-items:flex-start;
  }
  .cover .inner{position:absolute;left:150px;top:50%;transform:translateY(-50%)}
  .cover h1{font-family:var(--serif);font-size:118px;font-weight:700;letter-spacing:.1em;line-height:1.2;color:var(--ink)}
  .cover .cline{width:120px;height:3px;background:var(--rule);margin:30px 0 26px}
  .cover .csub{font-size:22px;color:var(--ink2);letter-spacing:.16em}
  .cover .deco{
    position:absolute;right:112px;bottom:136px;display:flex;gap:8px;align-items:flex-end;
    border-bottom:1px solid var(--deco-line);
  }
  .cover .deco i{display:block;width:5px;border-radius:2.5px 2.5px 0 0;opacity:.88}

  /* ---------- overview ---------- */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 18px;width:100%}
  .cell{
    border:1px solid var(--line);border-radius:10px;padding:17px 18px 16px;background:var(--card);
    cursor:pointer;transition:.22s;position:relative;overflow:hidden;
  }
  .cell:hover{transform:translateY(-3px);box-shadow:var(--card-shadow);border-color:transparent}
  .cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc)}
  .cell .cn{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:.05em}
  .cell .cy{font-size:11.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}
  .cell .ce{font-size:10.5px;color:var(--cc);letter-spacing:.14em;margin-top:7px}
  .cell.sum{cursor:default;background:transparent;border-style:dashed}
  .cell.sum:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .cell.sum .cn{font-size:22px;color:var(--ink3)}
  .cell.sum .cy{color:var(--ink3)}

  /* ---------- 朝代快速跳转 ---------- */
  .jump{flex:0 0 auto;display:flex;align-items:center;gap:16px;margin:2px 0 13px;min-height:24px}
  .jump .jlab{font-size:10.5px;letter-spacing:.18em;color:var(--ink3);white-space:nowrap}
  .jump .jlist{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between}
  .jump button{
    border:0;background:none;padding:0 0 3px;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;letter-spacing:.03em;color:var(--ink2);
    border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
  }
  .jump button:hover{color:var(--jc);border-bottom-color:var(--jc)}
  .jump button.cur{color:var(--jc);font-weight:700;border-bottom-color:var(--jc)}

  /* ---------- 页码 ---------- */
  #folio{
    position:absolute;right:58px;bottom:18px;z-index:12;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.14em;
    color:var(--folio);font-variant-numeric:tabular-nums;user-select:none;
  }
  #folio b{color:var(--ink2);font-weight:600}

  /* ---------- 主题切换 ---------- */
  #theme{
    position:absolute;left:50px;bottom:11px;z-index:12;
    display:inline-flex;align-items:center;gap:6px;
    border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;
    font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--ink3);
    transition:color .18s,background .18s;
  }
  #theme:hover{color:var(--ink);background:var(--card)}
  #theme .ico{font-size:12.5px;line-height:1}

  /* 深色模式下的线条对比度微调 */
  [data-theme="dark"] .axis-line{opacity:.5}
  [data-theme="dark"] .ev-link{opacity:.5}
  [data-theme="dark"] .sub-axis{opacity:.62}
  [data-theme="dark"] .phase-band{opacity:.24}
  [data-theme="dark"] .lane-bar{opacity:.86}
  [data-theme="dark"] .ev-dot{stroke-width:3}
  [data-theme="dark"] .axis-cap{stroke-width:2.2}

  /* 进度条：两端内收，避免贴着画布边缘像条瑕疵 */
  #prog{position:absolute;left:26px;right:26px;top:0;height:2px;z-index:60;opacity:.42;border-radius:0 0 2px 2px;overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:var(--rule);transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* 键盘焦点与减少动效 */
  .jump button:focus-visible,.cell:focus-visible,.dback:focus-visible,#theme:focus-visible{
    outline:2px solid var(--c,rgba(120,110,95,.7));outline-offset:3px;border-radius:4px;
  }
  .ev-g:focus{outline:none}
  .ev-g:focus-visible .ev-ring{opacity:1;stroke-width:2}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
      transition-duration:.001ms!important;transition-delay:0ms!important}
  }
</style>

<script>
/* =========================================================
   数据
   ========================================================= */
const ERA = {
  '上古三代'   : 'var(--e0)',
  '秦汉'       : 'var(--e1)',
  '魏晋南北朝' : 'var(--e2)',
  '隋唐五代'   : 'var(--e3)',
  '宋辽夏金'   : 'var(--e4)',
  '元明清'     : 'var(--e5)'
};

const DATA = [
/* 1 夏 */
{ era:'上古三代', name:'夏', span:[-2070,-1600], years:'约前2070 — 约前1600',
  lead:'中国第一个世袭制王朝。禅让让位于父子相传，部落联盟开始走向国家形态。年代为学界估算，尚无当时文字自证。',
  events:[
    {y:-2070,t:'禹建夏'},
    {y:-2040,t:'启继位'},
    {y:-1900,t:'太康失国'},
    {y:-1600,t:'商汤灭夏'}
  ],
  facts:[['存续','约 470 年'],['都城','阳城 · 斟鄩'],['末代','桀']] },

/* 2 商 */
{ era:'上古三代', name:'商', span:[-1600,-1046], years:'约前1600 — 前1046',
  lead:'甲骨文与青铜器的时代。晚期都城殷墟出土的卜辞，是汉字最早成体系的形态。',
  events:[
    {y:-1600,t:'商汤建商'},
    {y:-1300,t:'盘庚迁殷'},
    {y:-1250,t:'武丁中兴'},
    {y:-1046,t:'牧野之战'}
  ],
  facts:[['存续','约 554 年'],['都城','亳 → 殷'],['末代','帝辛（纣）']] },

/* 3 西周 */
{ era:'上古三代', name:'西周', span:[-1046,-771], years:'前1046 — 前771',
  lead:'分封制与宗法制在此成型，礼乐秩序奠定了此后三千年的政治文化底色。',
  events:[
    {y:-1046,t:'武王克商'},
    {y:-1042,t:'周公摄政'},
    {y:-841,t:'国人暴动'},
    {y:-771,t:'犬戎破镐京'}
  ],
  facts:[['存续','275 年'],['都城','镐京'],['末代','周幽王']] },

/* 4 东周 */
{ era:'上古三代', name:'东周', sub:'春秋 · 战国', span:[-770,-221], years:'前770 — 前221',
  lead:'周王室东迁后权威旁落。春秋争霸、战国兼并相继展开，百家争鸣于此际。周室于前256年灭亡，战国延续至秦统一。',
  phases:[{name:'春秋',s:-770,e:-476},{name:'战国',s:-475,e:-221}],
  events:[
    {y:-770,t:'平王东迁'},
    {y:-679,t:'齐桓公始霸'},
    {y:-632,t:'城濮之战'},
    {y:-403,t:'三家分晋'},
    {y:-356,t:'商鞅变法',side:'down'},
    {y:-260,t:'长平之战',side:'up'},
    {y:-221,t:'秦统一',side:'down'}
  ],
  facts:[['分期','春秋 前770–前476'],['','战国 前475–前221'],['结局','周室前256年亡']] },

/* 5 秦 */
{ era:'秦汉', name:'秦', span:[-221,-206], years:'前221 — 前206',
  lead:'中国第一次大一统。郡县制、书同文、车同轨、统一度量衡在此确立，却只维持了十五年。',
  events:[
    {y:-221,t:'统一六国'},
    {y:-213,t:'焚书坑儒'},
    {y:-210,t:'始皇崩'},
    {y:-209,t:'陈胜吴广起义'},
    {y:-206,t:'秦亡'}
  ],
  facts:[['存续','15 年'],['都城','咸阳'],['开国','秦始皇嬴政']] },

    {y:'1912.2',t:'清帝退位',d:'袁世凯与清室达成优待条件，隆裕太后颁退位诏书，宣统退位。'}

/* 把详情挂到对应事件上（按年份匹配） */
Object.keys(EVINFO).forEach(k => {
  const [nm, yy] = k.split(':');
  const d = DATA.find(x => x.name === nm);
  const e = d && (d.events || []).find(x => String(x.y) === yy);
  if (e) e.info = EVINFO[k];
  else console.warn('EVINFO 未匹配到事件:', k);
});

/* =========================================================
   工具
   ========================================================= */
const fmt = y => y < 0 ? '前' + (-y) : String(y);
const txtW = (s, fs) => [...s].reduce((n,c)=> n + (c.codePointAt(0) > 255 ? fs : fs*0.56), 0);
const nameSize = n => {
  const l = [...n].length;
  if (l <= 2) return 150;
  if (l === 3) return 122;
  if (l === 4) return 108;
  return 88;
};

/* =========================================================
   单轴时间轴
   ========================================================= */
function axisSVG(d){
  const W = 1320, L = 54, R = 54, AY = 182;
  const [a,b] = d.span;
  const X = y => L + (y - a) / (b - a) * (W - L - R);

  // ---- 第一遍：按年份从左到右依次落位 ----
  // 规则：先试「上方」，放不下就往右让（有上限），再放不下才换到「下方」。
  // 这样同一行里自左向右必然就是时间顺序，不会再出现年份倒序。
  const GAPX = 26, PUSH = 56, MINX = 2, MAXX = 1318;
  const rows = { up: [], down: [] };
  const rightOf = dir => rows[dir].length ? Math.max(...rows[dir]) : -Infinity;
  const sorted = d.events.map((e, i) => ({ e, i })).sort((p, q) => p.e.y - q.e.y);

  const lay = sorted.map(({ e, i }) => {
    const nw = txtW(e.t, 18.5), yw = txtW(fmt(e.y), 13.5);
    const w = Math.max(nw, yw), half = w / 2;
    // 端点事件内收，避免标签冲出画布
    const anchor = Math.max(MINX + half, Math.min(X(e.y), MAXX - half));
    const prefer = e.side === 'down' ? 'down' : 'up';
    const order = prefer === 'up' ? ['up', 'down'] : ['down', 'up'];
    let dir = null, lx = anchor;

    for (const d2 of order) {                       // 首选侧 + 有限右移
      const x = Math.max(anchor, rightOf(d2) + GAPX + half);
      if (x - anchor <= PUSH && x + half <= MAXX && x - half >= MINX) { dir = d2; lx = x; break; }
    }
    if (!dir) for (const d2 of order) {             // 放宽右移上限，只要不出框
      const x = Math.max(anchor, rightOf(d2) + GAPX + half);
      if (x + half <= MAXX && x - half >= MINX) { dir = d2; lx = x; break; }
    }
    if (!dir) { dir = prefer; lx = Math.max(MINX + half, Math.min(anchor, MAXX - half)); }

    rows[dir].push(lx + half);
    const ny = dir === 'up' ? AY - 48 : AY + 86;
    const yy = dir === 'up' ? ny - 23 : ny + 23;
    return { e, i, lx, dir, ny, yy, w };
  });

  // ---- 按实际占用范围定画布高度 ----
  let top = AY - 14, bot = AY + 14;
  lay.forEach(o => {
    top = Math.min(top, Math.min(o.ny, o.yy) - 23);
    bot = Math.max(bot, Math.max(o.ny, o.yy) + 9);
  });
  if (d.phases) bot = Math.max(bot, AY + 52);
  const H = Math.max(250, bot - top + 20);
  const y0 = (top + bot) / 2 - H / 2;

  // ---- 第二遍：出图 ----
  let s = `<svg viewBox="0 ${y0.toFixed(1)} ${W} ${H.toFixed(1)}" role="img" aria-label="${d.name}年表">`;
  s += `<line class="axis-line" x1="${L}" y1="${AY}" x2="${W-R}" y2="${AY}"/>`;
  // 事件点正好落在轴末端时，不再画端点圆，避免两个圆叠在一起
  const nearL = lay.some(o => Math.abs(X(o.e.y) - L) < 10);
  const nearR = lay.some(o => Math.abs(X(o.e.y) - (W - R)) < 10);
  if (!nearL) s += `<circle class="axis-cap" cx="${L}" cy="${AY}" r="5"/>`;
  if (!nearR) s += `<circle class="axis-cap" cx="${W-R}" cy="${AY}" r="5"/>`;

  if (d.phases){
    d.phases.forEach(p => {
      const x0 = X(p.s), x1 = X(p.e);
      s += `<line x1="${(x0+4).toFixed(1)}" y1="${AY+19}" x2="${(x1-4).toFixed(1)}" y2="${AY+19}" stroke="var(--c)" stroke-width="3" opacity=".3" stroke-linecap="round"/>`;
      s += `<text class="phase-name" x="${(x0+4).toFixed(1)}" y="${AY+41}">${p.name}</text>`;
    });
  }

  lay.forEach(o => {
    const l1 = o.dir === 'up' ? AY - 9 : AY + 9;
    const l2 = o.dir === 'up' ? o.ny + 7 : o.ny - 16;
    s += `<line class="ev-link" x1="${o.e.x ?? X(o.e.y)}" y1="${l1}" x2="${o.lx}" y2="${l2}"/>`;
    const dot = `<circle class="ev-dot" cx="${X(o.e.y)}" cy="${AY}" r="6.5" style="--pd:${(0.34+o.i*0.07).toFixed(2)}s"/>`;
    const nm = `<text class="ev-name" x="${o.lx}" y="${o.ny}">${o.e.t}</text>`
             + `<text class="ev-year" x="${o.lx}" y="${o.yy}">${fmt(o.e.y)}</text>`;
    if (o.e.info){
      // 有详情的事件：圆点与标签整体可点，外缘加一条虚线提示
      const ty0 = Math.min(o.ny, o.yy) - 21, ty1 = Math.max(o.ny, o.yy) + 8;
      s += `<g class="ev-g" data-k="${d.name}#${o.i}" tabindex="0" role="button">`
        +  `<rect class="ev-halo" x="${(o.lx-o.w/2-11).toFixed(1)}" y="${ty0.toFixed(1)}" width="${(o.w+22).toFixed(1)}" height="${(ty1-ty0).toFixed(1)}" rx="9"/>`
        +  `<circle class="ev-ring" cx="${X(o.e.y)}" cy="${AY}" r="12.5"/>`
        +  dot + nm
        +  `</g>`;
    } else {
      s += dot + nm;
    }
  });

  return s + '</svg>';
}

/* =========================================================
   泳道时间轴（并行时期）
   ========================================================= */
function lanesSVG(d){
  const W = 1320, AY = 132;
  const [a,b] = d.span;
  const GAP = 64;
  const n = d.lanes.length;
  const colW = (W - GAP*(n-1)) / n;
  const NAME_W = 78, YEAR_W = 62;
  const barW = colW - NAME_W - YEAR_W;
  const rowH = 30, barH = 18;

  let rows = 0;
  d.lanes.forEach(g => rows = Math.max(rows, g.items.length));
  const laneTop = AY + 34;
  const H = laneTop + rows*rowH + 16;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.name}并立政权年表">`;

  d.lanes.forEach((g, gi) => {
    const cx = gi * (colW + GAP);
    const bx = cx + NAME_W;
    const X = y => bx + (y - a) / (b - a) * barW;

    // 栏标题
    s += `<text class="lane-title" x="${cx}" y="16">${g.title}</text>`;

    // 事件轴
    s += `<line class="sub-axis" x1="${bx}" y1="${AY}" x2="${bx + barW}" y2="${AY}"/>`;
    const evs = (d.events || [])
      .map((e, ei) => ({ ...e, ei, x: X(e.y) }))
      .filter(e => n === 1 || e.col === gi)
      .sort((p, q) => p.y - q.y);
    // 单行排布：按年份自左向右，撞车就往右让，保证读到的年份始终单调递增
    let rowRight = -Infinity;
    evs.forEach((e, i) => {
      const w = Math.max(txtW(e.t, 15), txtW(fmt(e.y), 12.5));
      // 最后一栏允许向右多探出 26px，避免末尾两个标签挤成一团
      const minX = cx + 2, maxX = cx + colW - 2 + (gi === n - 1 ? 26 : 0);
      let tx = Math.max(minX, Math.min(e.x - w/2, maxX - w));   // 标签左边界
      tx = Math.max(tx, rowRight + 14);
      if (tx + w > maxX) tx = Math.max(minX, Math.max(rowRight + 14, maxX - w));
      rowRight = tx + w;
      const my = AY - 52, mid = tx + w/2;
      const dot = `<circle class="ev-dot" cx="${e.x}" cy="${AY}" r="5.5" style="--pd:${(0.34+i*0.08).toFixed(2)}s"/>`;
      const nm = `<text class="ev-name" x="${mid}" y="${my}" style="font-size:15px;text-anchor:middle">${e.t}</text>`
               + `<text class="ev-year" x="${mid}" y="${my+20}" style="font-size:12.5px;text-anchor:middle">${fmt(e.y)}</text>`;
      // 引线直接指向标签中心，标签被右移时也能对上
      s += `<line class="ev-link" x1="${e.x}" y1="${AY-8}" x2="${mid}" y2="${my+30}"/>`;
      if (e.info){
        s += `<g class="ev-g" data-k="${d.name}#${e.ei}" tabindex="0" role="button">`
          +  `<rect class="ev-halo" x="${(tx-9).toFixed(1)}" y="${(my-17).toFixed(1)}" width="${(w+18).toFixed(1)}" height="46" rx="8"/>`
          +  `<circle class="ev-ring" cx="${e.x}" cy="${AY}" r="11"/>`
          +  dot + nm
          +  `</g>`;
      } else {
        s += dot + nm;
      }
    });

    // 泳道
    g.items.forEach((it, ri) => {
      const y = laneTop + ri*rowH;
      const x0 = X(it.s), x1 = Math.min(X(it.e), bx + barW);
      const w = Math.max(x1 - x0, 3);
      const over = it.e > b;
      s += `<text class="lane-name" x="${cx + NAME_W - 12}" y="${y + barH/2 + 5}">${it.name}</text>`;
      const op = Math.max(0.62, 0.84 - ri * 0.038);
      // 被区间截断的条：略淡 + 末尾虚线延伸，明确表示"还没结束"
      s += `<rect class="lane-bar${over?' ghost':''}" style="opacity:${(over ? op * 0.8 : op).toFixed(2)}" x="${x0}" y="${y}" width="${w}" height="${barH}" rx="${barH/2}"/>`;
      if (over)
        s += `<line class="lane-more" x1="${x1}" y1="${y + barH/2}" x2="${x1 + 24}" y2="${y + barH/2}"/>`;
      const lbl = (it.e > b) ? fmt(it.s) + '–' + fmt(it.e) + '+' : fmt(it.s) + '–' + fmt(it.e);
      if (over)
        s += `<text class="lane-year" x="${x1 - 10}" y="${y + barH/2 + 4.5}" style="fill:#fff;opacity:.95;text-anchor:end">${lbl}</text>`;
      else
        s += `<text class="lane-year" x="${x1 + 9}" y="${y + barH/2 + 4.5}">${lbl}</text>`;
    });
  });

  return s + '</svg>';
}

/* =========================================================
   页面
   ========================================================= */
function miniHTML(d){
  const A = -2100, B = 1912;
  const l = (d.span[0] - A) / (B - A) * 100;
  const w = (d.span[1] - d.span[0]) / (B - A) * 100;
  return `<div class="mini">
    <span class="lbl">约前2070</span>
    <div class="bar"><i style="left:${l.toFixed(2)}%;width:${Math.max(w,0.6).toFixed(2)}%"></i></div>
    <span class="lbl">1912</span>
  </div>`;
}

function jumpBar(d){
  const btns = DATA.map((x,i) =>
    `<button data-jump="${i+1}" class="${x.name===d.name?'cur':''}" style="--jc:${ERA[x.era]}">${x.name}</button>`
  ).join('');
  return `<div class="jump anim" style="--d:.29s"><span class="jlab">跳 转</span><div class="jlist">${btns}</div></div>`;
}

function periodSlide(d, idx){
  const color = ERA[d.era];
  const fs = nameSize(d.name);
  const sub = d.sub ? `<span class="sub">${d.sub}</span>` : '';
  const viz = d.lanes ? lanesSVG(d) : axisSVG(d);
  const facts = d.facts.map(([k,v]) =>
    `<div class="fact"><div class="k">${k || '&nbsp;'}</div><div class="v">${v}</div></div>`).join('');
  const hasInfo = (d.events || []).some(e => e.info);
  const note = d.spanNote ? `<em class="span-note">${d.spanNote}</em>` : '';

  return `<section class="slide period" style="--c:${color}">
    <div class="head anim" style="--d:.02s">
      ${hasInfo ? '<div class="clickhint"><i></i>圆点可点，查看事件详情</div>' : ''}
      <div class="era">${d.era}</div>
    </div>
    <div class="tblock">
      <h1 class="dname anim" style="--d:.07s;font-size:${fs}px">${d.name}${sub}</h1>
      <div class="yrs anim" style="--d:.13s">${d.years}${note}</div>
      <p class="lead anim" style="--d:.19s">${d.lead}</p>
    </div>
    <div class="viz anim" style="--d:.22s">${viz}</div>
    ${jumpBar(d)}
    <div class="facts anim" style="--d:.34s">${facts}</div>
    ${miniHTML(d)}
  </section>`;
}

/* 事件详情页：经过 / 关键人物 / 影响 */
function eventSlide(d, e){
  const n = e.info;
  const steps = n.steps.map(s => `<div class="step">
      <div class="sy">${s.y}</div>
      <div class="st">${s.t}</div>
      <div class="sd">${s.d}</div>
    </div>`).join('');

  const ppl = n.people.map(p => `<div class="pp">
      <div><div class="pn">${p.n}</div><div class="pr">${p.r}</div></div>
      <div class="pd">${p.d}</div>
    </div>`).join('');

  const imp = n.after.map(([k,v],i) =>
    `<div class="icard anim" style="--d:${(0.3+i*0.05).toFixed(2)}s"><b>${k}</b><span>${v}</span></div>`).join('');

  return `<div class="head anim" style="--d:.02s">
      <button class="dback" data-back>‹ 返回 ${d.name}</button>
      <div class="era">${d.name} · ${d.years}</div>
    </div>
    <div class="dwrap">
    <div class="dtt anim" style="--d:.08s">
      <div class="dyear">${n.years}</div>
      <h2 class="dtitle">${e.t}</h2>
      <p class="dsum">${n.summary}</p>
    </div>
    <div class="dbody">
      <div class="dcol anim" style="--d:.15s">
        <div class="dh"><span>经 过</span><em>${n.steps.length} 个节点</em></div>
        <div class="steps${n.steps.length < 4 ? ' loose' : ''}">${steps}</div>
      </div>
      <div class="dcol anim" style="--d:.21s">
        <div class="dh"><span>关键人物</span><em>${n.people.length} 人</em></div>
        <div class="ppl">${ppl}</div>
      </div>
    </div>
    <div class="dimp">
      <div class="dh anim" style="--d:.27s"><span>影 响</span></div>
      <div class="imp" style="grid-template-columns:repeat(${n.after.length},1fr)">${imp}</div>
    </div>
    </div>`;
}

function coverSlide(){
  const deco = DATA.map(d => {
    const h = Math.max(10, Math.round((d.span[1] - d.span[0]) / 554 * 250));
    return `<i style="height:${h}px;background:${ERA[d.era]}"></i>`;
  }).join('');

  return `<section class="slide cover">
    <div class="deco">${deco}</div>
    <div class="inner">
      <h1 class="anim" style="--d:.1s">中国历史年表</h1>
      <div class="cline anim" style="--d:.22s"></div>
      <div class="csub anim" style="--d:.3s">从夏到清 · 约四千年</div>
    </div>
  </section>`;
}

function endSlide(){
  const cells = DATA.map((d,i) => {
    const c = ERA[d.era];
    return `<div class="cell" data-go="${i+1}" tabindex="0" role="button" style="--cc:${c}">
      <div class="cn">${d.name}</div>
      <div class="cy">${d.years.replace(/约/g,'')}</div>
      <div class="ce">${d.era}</div>
    </div>`;
  }).join('');
  // 19 个朝代 + 1 个合计格 = 20，正好填满 5 列 × 4 行
  const summary = `<div class="cell sum" style="--cc:var(--ink3)">
      <div class="cn">合 计</div>
      <div class="cy">19 个时期 · 约 3980 年</div>
      <div class="ce">夏 — 清</div>
    </div>`;

  return `<section class="slide overview" style="--c:#1F4E9C">
    <div class="head anim" style="--d:.02s">
      <div class="era">全 表</div>
    </div>
    <div class="tblock">
      <h1 class="dname anim" style="--d:.07s;font-size:88px">一览</h1>
      <div class="yrs anim" style="--d:.13s">19 个时期 · 约 3980 年</div>
    </div>
    <div class="viz anim" style="--d:.2s;align-items:flex-start;padding-top:18px">
      <div class="grid" style="width:100%">${cells}${summary}</div>
    </div>
  </section>`;
}

/* =========================================================
   装配
   ========================================================= */
const stage = document.getElementById('stage');
let html = coverSlide();
DATA.forEach((d,i) => html += periodSlide(d, i+2));
html += endSlide();
stage.innerHTML = html;
stage.appendChild(document.getElementById('prog'));
stage.appendChild(document.getElementById('folio'));
stage.appendChild(document.getElementById('theme'));

/* ---------- 主题 ---------- */
const themeBtn = document.getElementById('theme');
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.innerHTML = t === 'dark'
    ? '<span class="ico">☀</span><span class="tx">浅色</span>'
    : '<span class="ico">☾</span><span class="tx">深色</span>';
  try { localStorage.setItem('cn-hist-theme', t); } catch(e){}
}
/* ?t=dark / ?t=light 可强制指定，便于分享与截图；否则读上次的选择 */
(function(){
  let t = 'light';
  const forced = new URLSearchParams(location.search).get('t');
  if (forced === 'dark' || forced === 'light') t = forced;
  else { try { if (localStorage.getItem('cn-hist-theme') === 'dark') t = 'dark'; } catch(e){} }
  setTheme(t);
})();
function toggleTheme(){
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

/* ---------- 事件详情覆盖层 ---------- */
const DETAIL = {};
DATA.forEach(d => (d.events || []).forEach((e,i) => {
  if (e.info) DETAIL[d.name + '#' + i] = { d, e };
}));

/* ?e=明:1399 这种按年份写的也能认，内部转成下标键 */
function resolveKey(q){
  if (!q) return null;
  if (DETAIL[q]) return q;
  const [nm, yy] = q.split(':');
  const d = DATA.find(x => x.name === nm);
  if (!d) return null;
  const i = (d.events || []).findIndex(x => String(x.y) === yy);
  return i >= 0 ? d.name + '#' + i : null;
}

const detail = document.createElement('div');
detail.className = 'detail';
stage.appendChild(detail);

const detailOpen = () => detail.classList.contains('open');

function openEvent(k){
  const rec = DETAIL[k];
  if (!rec) return;
  detail.style.setProperty('--c', ERA[rec.d.era]);
  detail.innerHTML = eventSlide(rec.d, rec.e);
  void detail.offsetWidth;          // 先落位再加 open，动画才会跑
  detail.classList.add('open');
}

function closeEvent(){
  if (!detail.classList.contains('open')) return;
  detail.classList.remove('open');
}

const slides = [...stage.querySelectorAll('.slide')];
const total = slides.length;

let cur = 0;
slides[0].classList.add('active');

function go(i){
  if (detailOpen()) closeEvent();
  i = Math.max(0, Math.min(total - 1, i));
  if (i === cur) return;
  const prev = slides[cur];
  prev.classList.remove('active');
  prev.classList.add(i > cur ? 'past' : 'future');
  slides[i].classList.remove('past','future');
  // 强制重排以重启动画
  void slides[i].offsetWidth;
  slides[i].classList.add('active');
  cur = i;
  update();
}

function update(){
  document.getElementById('folio').innerHTML =
    `<b>${String(cur+1).padStart(2,'0')}</b> / ${total}`;
  document.querySelector('#prog i').style.width = ((cur)/(total-1)*100).toFixed(2) + '%';
}
update();

/* 支持 ?p=3 直达某一页 */
(function(){
  const q = parseInt(new URLSearchParams(location.search).get('p'), 10);
  if (!q || q < 2) return;
  const start = Math.min(total - 1, q - 1);
  slides[0].classList.remove('active');
  slides[0].classList.add('past');
  slides[start].classList.add('active');
  cur = start;
  update();
})();

/* 支持 ?e=明:1399 直接打开某个事件详情（也便于分享单条）
   注意：要先把底层切到对应朝代那页，否则「返回」会落回封面 */
(function(){
  const k = resolveKey(new URLSearchParams(location.search).get('e'));
  if (!k) return;
  const rec = DETAIL[k];
  const si = rec ? DATA.indexOf(rec.d) + 1 : -1;
  if (si > 0 && slides[si]) {
    slides[0].classList.remove('active');
    slides[0].classList.add('past');
    slides[si].classList.add('active');
    cur = si;
    update();
  }
  openEvent(k);
})();

stage.addEventListener('click', e => {
  // 先判主题按钮：此时还没改 DOM，e.target 仍在文档里。
  // 若放到按钮自己的 onclick 里改 innerHTML，再冒泡上来时 e.target 已脱离文档，
  // closest('#theme') 会返回 null，于是继续走到"点左右半屏翻页"，退到上一页。
  if (e.target.closest && e.target.closest('#theme')){ toggleTheme(); return; }
  if (e.target.closest('[data-back]')){ closeEvent(); return; }
  if (detailOpen()) return;
  const g = e.target.closest('.ev-g');
  if (g){ openEvent(g.dataset.k); return; }
  const j = e.target.closest('[data-jump]');
  if (j){ go(+j.dataset.jump); return; }
  const cell = e.target.closest('.cell');
  if (cell){ go(+cell.dataset.go); return; }
  // 左右半区点击翻页
  const r = stage.getBoundingClientRect();
  const rel = (e.clientX - r.left) / r.width;
  if (rel > 0.72) go(cur+1);
  else if (rel < 0.28) go(cur-1);
});

window.addEventListener('keydown', e => {
  const k = e.key;
  // 键盘可达：聚焦在事件标签 / 总览格子上时，回车或空格等同点击
  const ae = document.activeElement;
  if (ae && !detailOpen() && (k === 'Enter' || k === ' ')){
    if (ae.classList && ae.classList.contains('ev-g') && ae.dataset.k){
      e.preventDefault(); openEvent(ae.dataset.k); return;
    }
    if (ae.classList && ae.classList.contains('cell') && ae.dataset.go){
      e.preventDefault(); go(+ae.dataset.go); return;
    }
  }
  if (detailOpen()){
    if (['Escape','Backspace','ArrowLeft','ArrowUp','PageUp'].includes(k)){
      e.preventDefault(); closeEvent();
    }
    return;
  }
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); go(cur+1); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); go(cur-1); }
  else if (k === 'd' || k === 'D'){
    toggleTheme();
  }
  else if (k === 'f' || k === 'F'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  else if (k === 'Home'){ e.preventDefault(); go(0); }
  else if (k === 'End'){ e.preventDefault(); go(total-1); }
});

let lock = false;
window.addEventListener('wheel', e => {
  if (detailOpen()) return;
  if (Math.abs(e.deltaY) < 12) return;
  if (lock) return;
  lock = true;
  go(cur + (e.deltaY > 0 ? 1 : -1));
  setTimeout(()=>lock = false, 620);
}, { passive:true });

let ty = 0;
window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive:true });
window.addEventListener('touchend', e => {
  if (detailOpen()) return;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dy) > 50) go(cur + (dy < 0 ? 1 : -1));
}, { passive:true });

/* 自适应缩放 */
function fit(){
  const s = Math.min(window.innerWidth / 1600, (window.innerHeight - 56) / 900);
  stage.style.transform = `scale(${s})`;
}
fit();
window.addEventListener('resize', fit);
</script>
